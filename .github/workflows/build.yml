name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LocalFlow-windows-x64
          - os: macos-14
            artifact: LocalFlow-macos-arm64
          - os: macos-15-intel
            artifact: LocalFlow-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_hotkey.py tests/test_textproc.py tests/test_cloud_polish.py tests/test_live.py tests/test_learn.py
      - name: Fetch bundled model
        run: python scripts/fetch_model.py base.en
      - name: Build
        run: pyinstaller --noconfirm --clean localflow.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Move-Item dist/LocalFlow pkg/LocalFlow
          Copy-Item README.md pkg/LocalFlow/README.md
          Compress-Archive -Path pkg/LocalFlow -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/LocalFlow.app
          mkdir -p pkg/LocalFlow
          mv dist/LocalFlow.app pkg/LocalFlow/
          cp README.md pkg/LocalFlow/README.md
          ditto -c -k --sequesterRsrc --keepParent pkg/LocalFlow "${{ matrix.artifact }}.zip"
      - name: Selftest the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive "${{ matrix.artifact }}.zip" -DestinationPath unzipped
          $exe = Resolve-Path unzipped/LocalFlow/LocalFlow.exe
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--out","$PWD/selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path unzipped/LocalFlow/data)) { Write-Error "data dir not created next to exe"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-ui","$PWD/smoke.json" -Wait -PassThru
          Get-Content smoke.json
          if (-not (Select-String -Path smoke.json -Pattern '"ok": true' -Quiet)) { exit 1 }
      - name: Selftest the packaged app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          ditto -x -k "${{ matrix.artifact }}.zip" unzipped
          unzipped/LocalFlow/LocalFlow.app/Contents/MacOS/LocalFlow --selftest --out "$PWD/selftest.json"
          cat selftest.json
          test -d unzipped/LocalFlow/data
          unzipped/LocalFlow/LocalFlow.app/Contents/MacOS/LocalFlow --smoke-ui "$PWD/smoke.json"
          cat smoke.json
          grep -q '"ok": true' smoke.json
      - name: Show app log
        if: always()
        shell: bash
        run: cat unzipped/LocalFlow/data/localflow.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
