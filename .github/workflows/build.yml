name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LocalFlow-windows-x64
          - os: macos-14
            artifact: LocalFlow-macos-arm64
          - os: macos-15-intel
            artifact: LocalFlow-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_hotkey.py tests/test_textproc.py tests/test_cloud_polish.py tests/test_live.py tests/test_learn.py tests/test_continuous.py
      - name: Fetch bundled model
        run: python scripts/fetch_model.py base.en
      - name: macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out build/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
      - name: Build
        run: pyinstaller --noconfirm --clean localflow.spec
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import localflow; print(localflow.__version__)')" >> "$GITHUB_OUTPUT"

      # ---------------- Windows: portable zip + installer ----------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item -Recurse dist/LocalFlow pkg/LocalFlow
          Copy-Item README.md pkg/LocalFlow/README.md
          New-Item -ItemType Directory -Force pkg/LocalFlow/data | Out-Null
          "LocalFlow keeps your settings, transcripts and downloaded models in this folder, so the whole app stays portable. Delete the folder to reset." | Set-Content pkg/LocalFlow/data/README.txt
          Compress-Archive -Path pkg/LocalFlow -DestinationPath "${{ matrix.artifact }}.zip"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\dist\LocalFlow" installer\localflow.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item dist/LocalFlow-Setup-x64.exe LocalFlow-Setup-x64.exe
      - name: Test portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive "${{ matrix.artifact }}.zip" -DestinationPath unzipped
          $exe = Resolve-Path unzipped/LocalFlow/LocalFlow.exe
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--out","$PWD/selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { exit 1 }
          $sel = Get-Content selftest.json | ConvertFrom-Json
          if ($sel.data_dir -ne (Join-Path (Resolve-Path unzipped/LocalFlow) "data")) { Write-Error "zip is not portable: $($sel.data_dir)"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-ui","$PWD/smoke.json" -Wait -PassThru
          Get-Content smoke.json
          if (-not (Select-String -Path smoke.json -Pattern '"ok": true' -Quiet)) { exit 1 }
      - name: Test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\LocalFlow-Setup-x64.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit $($p.ExitCode)"; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA "Programs\LocalFlow\LocalFlow.exe"
          if (-not (Test-Path $app)) { Write-Error "not installed at $app"; exit 1 }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "LocalFlow.lnk"))) { Write-Error "no desktop shortcut"; exit 1 }
          $p = Start-Process -FilePath $app -ArgumentList "--selftest","--out","$PWD/installed.json" -Wait -PassThru
          Get-Content installed.json
          if ($p.ExitCode -ne 0) { exit 1 }
          $sel = Get-Content installed.json | ConvertFrom-Json
          if ($sel.data_dir -ne (Join-Path $env:LOCALAPPDATA "LocalFlow")) { Write-Error "installed copy should use %LOCALAPPDATA%\LocalFlow, got $($sel.data_dir)"; exit 1 }
          $un = Join-Path $env:LOCALAPPDATA "Programs\LocalFlow\unins000.exe"
          $p = Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $app) { Write-Error "uninstall left $app"; exit 1 }
          Write-Host "install -> selftest -> uninstall OK"

      # ---------------- macOS: portable zip + dmg ----------------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/LocalFlow.app
          mkdir -p pkg/LocalFlow/data
          cp -R dist/LocalFlow.app pkg/LocalFlow/
          cp README.md pkg/LocalFlow/README.md
          echo "LocalFlow keeps your settings, transcripts and downloaded models in this folder, so the whole app stays portable. Delete the folder to reset." > pkg/LocalFlow/data/README.txt
          ditto -c -k --sequesterRsrc --keepParent pkg/LocalFlow "${{ matrix.artifact }}.zip"
          mkdir -p dmgroot
          cp -R dist/LocalFlow.app dmgroot/
          ln -s /Applications dmgroot/Applications
          cat > "dmgroot/Read me first.txt" <<'TXT'
          1. Drag LocalFlow into Applications.
          2. LocalFlow isn't notarized by Apple yet, so the first time you open it macOS will
             refuse. Open System Settings > Privacy & Security, scroll down and click
             "Open Anyway" next to LocalFlow (or run: xattr -dr com.apple.quarantine /Applications/LocalFlow.app).
          3. Allow Microphone, Accessibility and Input Monitoring when asked, then quit and reopen LocalFlow.
          TXT
          hdiutil create -volname LocalFlow -srcfolder dmgroot -ov -format UDZO "${{ matrix.artifact }}.dmg"
      - name: Test portable zip (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          ditto -x -k "${{ matrix.artifact }}.zip" unzipped
          unzipped/LocalFlow/LocalFlow.app/Contents/MacOS/LocalFlow --selftest --out "$PWD/selftest.json"
          cat selftest.json
          python -c "import json,os,sys; d=json.load(open('selftest.json'))['data_dir']; sys.exit(0 if os.path.realpath(d)==os.path.realpath('unzipped/LocalFlow/data') else 'zip not portable: '+d)"
          unzipped/LocalFlow/LocalFlow.app/Contents/MacOS/LocalFlow --smoke-ui "$PWD/smoke.json"
          cat smoke.json
          grep -q '"ok": true' smoke.json
      - name: Test dmg (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          hdiutil attach "${{ matrix.artifact }}.dmg" -nobrowse -mountpoint /tmp/lfdmg
          test -L /tmp/lfdmg/Applications && test -d /tmp/lfdmg/LocalFlow.app
          cp -R /tmp/lfdmg/LocalFlow.app /tmp/LocalFlow.app
          hdiutil detach /tmp/lfdmg
          codesign --verify --deep /tmp/LocalFlow.app
          /tmp/LocalFlow.app/Contents/MacOS/LocalFlow --selftest --out "$PWD/installed.json"
          cat installed.json
          python -c "import json,os,sys; d=json.load(open('installed.json'))['data_dir']; sys.exit(0 if d==os.path.expanduser('~/Library/Application Support/LocalFlow') else 'installed app should use Application Support, got '+d)"
      - name: Show app log
        if: always()
        shell: bash
        run: cat unzipped/LocalFlow/data/localflow.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.dmg
            LocalFlow-Setup-x64.exe
          if-no-files-found: ignore
          retention-days: 30
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.dmg
            LocalFlow-Setup-x64.exe
