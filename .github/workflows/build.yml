name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LocalFlow-windows-x64
          - os: macos-14
            artifact: LocalFlow-macos-arm64
          - os: macos-15-intel
            artifact: LocalFlow-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_hotkey.py tests/test_textproc.py tests/test_cloud_polish.py tests/test_live.py tests/test_learn.py tests/test_continuous.py tests/test_dictionary.py tests/test_chunked.py tests/test_update_import.py tests/test_feedback.py tests/test_edits.py tests/test_sync.py tests/test_apple_gpu.py tests/test_search.py
      - name: Fetch bundled model
        run: python scripts/fetch_model.py base.en
      - name: macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out build/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
      - name: Google sign-in client (optional)
        # Account sync needs a Google OAuth "Desktop app" client. It comes from repository
        # secrets so it never sits in the source; without them the build just has no sign-in.
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.LOCALFLOW_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.LOCALFLOW_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            python -c "import os; open('localflow/_oauth_client.py','w').write('CLIENT_ID = %r\nCLIENT_SECRET = %r\n' % (os.environ['GOOGLE_CLIENT_ID'], os.environ['GOOGLE_CLIENT_SECRET']))"
            echo "Google sign-in: configured"
          else
            echo "::notice::No Google sign-in client secrets set; building without account sync."
          fi
      - name: Build
        run: pyinstaller --noconfirm --clean localflow.spec
      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import localflow; print(localflow.__version__)')" >> "$GITHUB_OUTPUT"

      # ---------------- Code signing (optional; see SIGNING.md) ----------------
      # Signing turns on when ALL of a platform's secrets are set. None set: builds are
      # unsigned (mac: ad-hoc + hardened runtime) with a notice. Only some set: fail, so a
      # half-configured setup can't silently publish unsigned builds.
      - name: Signing credentials
        id: sign
        shell: bash
        env:
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          AZ_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          MAC_P12: ${{ secrets.MACOS_CERT_P12 }}
          MAC_P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          check() {  # name, then values
            local name=$1; shift; local set=0 total=$#
            for v in "$@"; do [ -n "$v" ] && set=$((set+1)); done
            if [ "$set" = 0 ]; then echo "::notice::$name signing not configured: building unsigned"; echo "$name=false" >> "$GITHUB_OUTPUT"
            elif [ "$set" = "$total" ]; then echo "$name signing: all $total secrets present"; echo "$name=true" >> "$GITHUB_OUTPUT"
            else echo "::error::$name signing is half-configured ($set of $total secrets set); see SIGNING.md"; exit 1; fi
          }
          if [ "$RUNNER_OS" = "Windows" ]; then check windows "$AZ_TENANT" "$AZ_CLIENT" "$AZ_SECRET" "$AZ_ENDPOINT" "$AZ_ACCOUNT" "$AZ_PROFILE"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then check mac "$MAC_P12" "$MAC_P12_PASSWORD" "$ASC_KEY" "$ASC_KEY_ID" "$ASC_ISSUER"; fi
      - name: Sign app (Windows, Azure Artifact Signing)
        if: runner.os == 'Windows' && steps.sign.outputs.windows == 'true'
        uses: azure/artifact-signing-action@v2
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\LocalFlow
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ---------------- Windows: portable zip + installer ----------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item -Recurse dist/LocalFlow pkg/LocalFlow
          Copy-Item README.md pkg/LocalFlow/README.md
          New-Item -ItemType Directory -Force pkg/LocalFlow/data | Out-Null
          "LocalFlow keeps your settings, transcripts and downloaded models in this folder, so the whole app stays portable. Delete the folder to reset." | Set-Content pkg/LocalFlow/data/README.txt
          Compress-Archive -Path pkg/LocalFlow -DestinationPath "${{ matrix.artifact }}.zip"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\dist\LocalFlow" installer\localflow.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item dist/LocalFlow-Setup-x64.exe LocalFlow-Setup-x64.exe
      - name: Sign installer (Windows, Azure Artifact Signing)
        if: runner.os == 'Windows' && steps.sign.outputs.windows == 'true'
        uses: azure/artifact-signing-action@v2
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signature (Windows)
        if: runner.os == 'Windows' && steps.sign.outputs.windows == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("dist/LocalFlow/LocalFlow.exe", "LocalFlow-Setup-x64.exe")) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { exit 1 }
          }
      - name: Test portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive "${{ matrix.artifact }}.zip" -DestinationPath unzipped
          $exe = Resolve-Path unzipped/LocalFlow/LocalFlow.exe
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--out","$PWD/selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { exit 1 }
          $sel = Get-Content selftest.json | ConvertFrom-Json
          if ($sel.data_dir -ne (Join-Path (Resolve-Path unzipped/LocalFlow) "data")) { Write-Error "zip is not portable: $($sel.data_dir)"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-ui","$PWD/smoke.json" -Wait -PassThru
          Get-Content smoke.json
          if (-not (Select-String -Path smoke.json -Pattern '"ok": true' -Quiet)) { exit 1 }
      - name: Test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\LocalFlow-Setup-x64.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit $($p.ExitCode)"; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA "Programs\LocalFlow\LocalFlow.exe"
          if (-not (Test-Path $app)) { Write-Error "not installed at $app"; exit 1 }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "LocalFlow.lnk"))) { Write-Error "no desktop shortcut"; exit 1 }
          $p = Start-Process -FilePath $app -ArgumentList "--selftest","--out","$PWD/installed.json" -Wait -PassThru
          Get-Content installed.json
          if ($p.ExitCode -ne 0) { exit 1 }
          $sel = Get-Content installed.json | ConvertFrom-Json
          if ($sel.data_dir -ne (Join-Path $env:LOCALAPPDATA "LocalFlow")) { Write-Error "installed copy should use %LOCALAPPDATA%\LocalFlow, got $($sel.data_dir)"; exit 1 }
          $un = Join-Path $env:LOCALAPPDATA "Programs\LocalFlow\unins000.exe"
          $p = Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path $app) { Write-Error "uninstall left $app"; exit 1 }
          Write-Host "install -> selftest -> uninstall OK"
      - name: Test in-app update (Windows installer + portable)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}  # shared runner IPs exhaust the anonymous API limit
        run: |
          $latest = (Invoke-RestMethod -Headers @{Authorization = "Bearer $env:GITHUB_TOKEN"} https://api.github.com/repos/${{ github.repository }}/releases/latest).tag_name.TrimStart("v")
          Write-Host "latest release: $latest"
          function Wait-Version($exe, $want) {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 5
              if (Test-Path $exe) {
                $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--out","$PWD/v.json" -PassThru; $p.WaitForExit()
                if (Test-Path v.json) { $v = (Get-Content v.json | ConvertFrom-Json).version; Remove-Item v.json; if ($v -eq $want) { return $true } }
              }
            }
            return $false
          }
          # 1) installed copy: pretend to be 0.0.1, update, expect the latest release installed in place
          $p = Start-Process -FilePath .\LocalFlow-Setup-x64.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          $app = Join-Path $env:LOCALAPPDATA "Programs\LocalFlow\LocalFlow.exe"
          New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA "LocalFlow") | Out-Null
          "keep me" | Set-Content (Join-Path $env:LOCALAPPDATA "LocalFlow\marker.txt")
          $env:LOCALFLOW_PRETEND_VERSION = "0.0.1"
          # WaitForExit, not -Wait: -Wait also waits for the helper and the relaunched app it starts.
          $p = Start-Process -FilePath $app -ArgumentList "--update-now","$PWD/upd.json" -PassThru; $p.WaitForExit()
          $env:LOCALFLOW_PRETEND_VERSION = $null
          Get-Content upd.json
          if (-not (Select-String -Path upd.json -Pattern '"handed_over": true' -Quiet)) { Write-Error "installer update not started"; exit 1 }
          if (-not (Wait-Version $app $latest)) { Write-Error "installed copy never reached $latest"; exit 1 }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "LocalFlow\marker.txt"))) { Write-Error "update lost user data"; exit 1 }
          Get-Process LocalFlow -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process -FilePath (Join-Path $env:LOCALAPPDATA "Programs\LocalFlow\unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Write-Host "installer copy updated to $latest, data kept"
          # 2) portable copy: same, files replaced, data\ untouched
          Expand-Archive "${{ matrix.artifact }}.zip" -DestinationPath portable-upd
          $pexe = Resolve-Path portable-upd/LocalFlow/LocalFlow.exe
          "keep me" | Set-Content portable-upd/LocalFlow/data/marker.txt
          $env:LOCALFLOW_PRETEND_VERSION = "0.0.1"
          $p = Start-Process -FilePath $pexe -ArgumentList "--update-now","$PWD/upd2.json" -PassThru; $p.WaitForExit()
          $env:LOCALFLOW_PRETEND_VERSION = $null
          Get-Content upd2.json
          if (-not (Wait-Version $pexe $latest)) { Write-Error "portable copy never reached $latest"; exit 1 }
          if (-not (Test-Path portable-upd/LocalFlow/data/marker.txt)) { Write-Error "update lost the portable data folder"; exit 1 }
          Get-Process LocalFlow -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "portable copy updated to $latest, data kept"

      # ---------------- macOS: portable zip + dmg ----------------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_P12: ${{ secrets.MACOS_CERT_P12 }}
          MAC_P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ "${{ steps.sign.outputs.mac }}" = "true" ]; then
            kc="$RUNNER_TEMP/signing.keychain-db"; kcpass=$(uuidgen)
            security create-keychain -p "$kcpass" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpass" "$kc"
            echo "$MAC_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$MAC_P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
            security set-key-partition-list -S apple-tool:,apple: -k "$kcpass" "$kc" >/dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            identity=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
            [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
            echo "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/asc.p8"
            notarize() { xcrun notarytool submit "$1" --key "$RUNNER_TEMP/asc.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER" --wait --timeout 30m; }
          else
            identity="-"
          fi
          scripts/macos_sign.sh "$identity" dist/LocalFlow.app
          if [ "$identity" != "-" ]; then
            ditto -c -k --keepParent dist/LocalFlow.app "$RUNNER_TEMP/notarize.zip"
            notarize "$RUNNER_TEMP/notarize.zip"
            xcrun stapler staple dist/LocalFlow.app
          fi
          mkdir -p pkg/LocalFlow/data
          cp -R dist/LocalFlow.app pkg/LocalFlow/
          cp README.md pkg/LocalFlow/README.md
          echo "LocalFlow keeps your settings, transcripts and downloaded models in this folder, so the whole app stays portable. Delete the folder to reset." > pkg/LocalFlow/data/README.txt
          ditto -c -k --sequesterRsrc --keepParent pkg/LocalFlow "${{ matrix.artifact }}.zip"
          mkdir -p dmgroot
          cp -R dist/LocalFlow.app dmgroot/
          ln -s /Applications dmgroot/Applications
          cat > "dmgroot/Read me first.txt" <<'TXT'
          1. Drag LocalFlow into Applications.
          2. LocalFlow isn't notarized by Apple yet, so the first time you open it macOS will
             refuse. Open System Settings > Privacy & Security, scroll down and click
             "Open Anyway" next to LocalFlow (or run: xattr -dr com.apple.quarantine /Applications/LocalFlow.app).
          3. Allow Microphone, Accessibility and Input Monitoring when asked, then quit and reopen LocalFlow.
          TXT
          # hdiutil intermittently fails with "Resource busy" on GitHub's macOS runners
          # (background indexing/scanning holds the files); retry instead of failing the release.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname LocalFlow -srcfolder dmgroot -ov -format UDZO "${{ matrix.artifact }}.dmg"; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            echo "hdiutil busy, retrying ($attempt)"; sleep $((attempt * 5))
          done
          if [ "$identity" != "-" ]; then
            codesign --force --timestamp --sign "$identity" "${{ matrix.artifact }}.dmg"
            notarize "${{ matrix.artifact }}.dmg"
            xcrun stapler staple "${{ matrix.artifact }}.dmg"
            spctl -a -vvv -t install "${{ matrix.artifact }}.dmg"
          fi
      - name: Test portable zip (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          ditto -x -k "${{ matrix.artifact }}.zip" unzipped
          unzipped/LocalFlow/LocalFlow.app/Contents/MacOS/LocalFlow --selftest --out "$PWD/selftest.json"
          cat selftest.json
          python -c "import json,os,sys; d=json.load(open('selftest.json'))['data_dir']; sys.exit(0 if os.path.realpath(d)==os.path.realpath('unzipped/LocalFlow/data') else 'zip not portable: '+d)"
          unzipped/LocalFlow/LocalFlow.app/Contents/MacOS/LocalFlow --smoke-ui "$PWD/smoke.json"
          cat smoke.json
          grep -q '"ok": true' smoke.json
      - name: Test dmg (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          hdiutil attach "${{ matrix.artifact }}.dmg" -nobrowse -mountpoint /tmp/lfdmg
          test -L /tmp/lfdmg/Applications && test -d /tmp/lfdmg/LocalFlow.app
          cp -R /tmp/lfdmg/LocalFlow.app /tmp/LocalFlow.app
          hdiutil detach /tmp/lfdmg
          codesign --verify --deep /tmp/LocalFlow.app
          /tmp/LocalFlow.app/Contents/MacOS/LocalFlow --selftest --out "$PWD/installed.json"
          cat installed.json
          python -c "import json,os,sys; d=json.load(open('installed.json'))['data_dir']; sys.exit(0 if d==os.path.expanduser('~/Library/Application Support/LocalFlow') else 'installed app should use Application Support, got '+d)"
      - name: Test Apple GPU (MLX) in the packaged app
        # Downloads the MLX runtime + base.en in MLX format into a scratch data folder and
        # transcribes on the GPU. Hosted runners are VMs whose Metal support is uncertain, so a
        # failure here is reported but doesn't block the release (the real check is on a Mac).
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p /tmp/lfgpu
          LOCALFLOW_DATA_DIR=/tmp/lfgpu unzipped/LocalFlow/LocalFlow.app/Contents/MacOS/LocalFlow \
            --selftest --download-apple-gpu --device apple --out "$PWD/apple.json" || true
          cat apple.json || true
          cat /tmp/lfgpu/localflow.log 2>/dev/null | tail -20 || true
          grep -q '"ok": true' apple.json && grep -q '"device": "apple"' apple.json
      - name: Test in-app update (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ${{ github.token }}  # shared runner IPs exhaust the anonymous API limit
        run: |
          latest=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          echo "latest release: $latest"
          ditto -x -k "${{ matrix.artifact }}.zip" mac-upd
          echo "keep me" > mac-upd/LocalFlow/data/marker.txt
          app="$PWD/mac-upd/LocalFlow/LocalFlow.app"
          LOCALFLOW_PRETEND_VERSION=0.0.1 "$app/Contents/MacOS/LocalFlow" --update-now "$PWD/upd.json"
          cat upd.json; grep -q '"handed_over": true' upd.json
          for i in $(seq 1 60); do
            sleep 5
            if [ -x "$app/Contents/MacOS/LocalFlow" ] && "$app/Contents/MacOS/LocalFlow" --selftest --out "$PWD/v.json" >/dev/null 2>&1; then
              v=$(python3 -c "import json; print(json.load(open('v.json'))['version'])")
              [ "$v" = "$latest" ] && break
            fi
          done
          [ "$v" = "$latest" ] || { echo "mac copy never reached $latest (last: $v)"; exit 1; }
          test -f mac-upd/LocalFlow/data/marker.txt || { echo "update lost the data folder"; exit 1; }
          pkill -f "LocalFlow.app/Contents/MacOS/LocalFlow" || true
          echo "mac copy updated to $latest, data kept"
      - name: Show app log
        if: always()
        shell: bash
        run: cat unzipped/LocalFlow/data/localflow.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.dmg
            LocalFlow-Setup-x64.exe
          if-no-files-found: ignore
          retention-days: 30

  # One release, published only after every platform built and passed its tests. Attaching
  # from each matrix job made the first finished job's partial release "latest" while the
  # others were still testing updates against "latest" (v0.10.0: 2 of 6 files, 2 jobs failed).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check all six files are there
        run: |
          ls -la dist
          for f in LocalFlow-Setup-x64.exe LocalFlow-windows-x64.zip LocalFlow-macos-arm64.zip \
                   LocalFlow-macos-arm64.dmg LocalFlow-macos-intel.zip LocalFlow-macos-intel.dmg; do
            test -s "dist/$f" || { echo "missing $f"; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: dist/*
